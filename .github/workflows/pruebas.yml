name: Pruebas de Mercadito

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integridad:
    name: Integridad de datos (${{ matrix.timezone }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/Argentina/Buenos_Aires]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ejecutar todas las pruebas unitarias, anteriores y nuevas
        run: node --test tests/Unit/*.test.cjs

  navegador:
    name: Recorridos E2E e integridad persistida
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar todos los E2E y generar informe
        run: npx playwright test --reporter=list,html
      - name: Conservar informe y evidencia de fallos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-mercadito
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
